[project]
name = "logprob-llm"
version = "0.1.0"
description = "OSS log-prob LLM: a small fine-tuned model returning calibrated probabilities over a closed answer space, on Databricks."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
# Local dev-loop: tokenizer checks and (optionally) local scoring.
local = [
    "transformers>=4.44",
]
# Talking to Databricks: fine-tuning, serving, and the completions client.
databricks = [
    "databricks-sdk>=0.30",
    "mlflow>=2.15",
    "openai>=1.40",
]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/logprob_llm"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
