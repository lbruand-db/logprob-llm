name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      # Resolve from public PyPI (no committed lock; runner has no internal mirror).
      UV_INDEX_URL: https://pypi.org/simple
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies (project + dev)
        run: uv sync --extra dev --python ${{ matrix.python-version }}

      - name: Run tests
        run: uv run --python ${{ matrix.python-version }} pytest -q

  compile:
    name: compile (notebooks + package)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Notebooks and data/ are not imported by the tests; byte-compile them so
      # a syntax error anywhere in the repo fails CI (Databricks notebook source
      # magics are '# MAGIC' comments and compile fine as plain Python).
      - name: Byte-compile all Python
        run: python -m py_compile src/logprob_llm/*.py data/*.py notebooks/*.py
